appId: com.hanuri.app
name: "03 - AI Chat Flow"
tags:
  - ai-chat
  - golden-path

---

- launchApp

# Navigate to AI Chat tab
- waitForAnimationToEnd
- tapOn:
    id: "tab-ai-chat"

# AIHubScreen — tap the Cafe scenario (first free scenario)
- waitForAnimationToEnd
- tapOn:
    id: "scenario-cafe"

# AIChatScreen — type a message and send
# Note: Maestro's inputText doesn't support non-ASCII (Korean) text on Android
# (https://github.com/mobile-dev-inc/maestro/issues/146) — pasteText works around it.
- waitForAnimationToEnd
- tapOn:
    id: "input-chat"
- setClipboard: "안녕하세요"
- pasteText
- hideKeyboard
- tapOn:
    id: "btn-send"

# Wait for AI response to appear
- waitForAnimationToEnd

# Send a follow-up message
- tapOn:
    id: "input-chat"
- setClipboard: "커피 한 잔 주세요"
- pasteText
- hideKeyboard
- tapOn:
    id: "btn-send"

- waitForAnimationToEnd
